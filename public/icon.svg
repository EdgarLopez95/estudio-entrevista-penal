<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Rich dark navy gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#1A2744" />
      <stop offset="60%" stop-color="#0E162B" />
      <stop offset="100%" stop-color="#080D1A" />
    </radialGradient>

    <!-- Metallic Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE5A4" />
      <stop offset="25%" stop-color="#E2B755" />
      <stop offset="50%" stop-color="#FBF0B9" />
      <stop offset="75%" stop-color="#C99429" />
      <stop offset="100%" stop-color="#AA771C" />
    </linearGradient>

    <!-- Soft Gold Radial for highlights -->
    <radialGradient id="goldHighlight" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#FFF5D1" />
      <stop offset="100%" stop-color="#DDA638" />
    </radialGradient>

    <!-- Subtle glow filter -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)" />

  <g transform="translate(20, 20) scale(0.92)">
    <!-- Outer ornate border -->
    <circle cx="256" cy="256" r="236" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" opacity="0.4" />
    <circle cx="256" cy="256" r="226" fill="none" stroke="url(#goldGrad)" stroke-width="5" />
    <circle cx="256" cy="256" r="217" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="3 5" opacity="0.6" />

    <!-- Corner/Cardinal accent diamonds -->
    <path d="M 256, 33 L 260, 40 L 256, 47 L 252, 40 Z" fill="url(#goldGrad)" />
    <path d="M 256, 465 L 260, 472 L 256, 479 L 252, 472 Z" fill="url(#goldGrad)" />
    <path d="M 40, 256 L 47, 260 L 54, 256 L 47, 252 Z" fill="url(#goldGrad)" />
    <path d="M 465, 256 L 472, 260 L 479, 256 L 472, 252 Z" fill="url(#goldGrad)" />

    <!-- Scales of Justice Group -->
    <g id="scales" stroke="url(#goldGrad)" stroke-linecap="round" stroke-linejoin="round">
      
      <!-- Top Flame / Finial -->
      <path d="M 256, 92 C 253, 105 247, 112 247, 120 C 247, 126 251, 130 256, 130 C 261, 130 265, 126 265, 120 C 265, 112 259, 105 256, 92 Z" fill="url(#goldGrad)" stroke="none" />
      
      <!-- Central Fulcrum Pivot Ring -->
      <circle cx="256" cy="146" r="14" fill="#0E162B" stroke="url(#goldGrad)" stroke-width="4.5" />
      <circle cx="256" cy="146" r="6" fill="url(#goldGrad)" stroke="none" />

      <!-- Balance Beam (Crossbar) with slight architectural arc -->
      <path d="M 124, 168 C 170, 154 220, 148 256, 148 C 292, 148 342, 154 388, 168" fill="none" stroke="url(#goldGrad)" stroke-width="7" />
      <path d="M 124, 168 C 170, 158 220, 152 256, 152 C 292, 152 342, 158 388, 168" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" />

      <!-- Beam End Knobs -->
      <circle cx="124" cy="168" r="8" fill="url(#goldHighlight)" stroke="none" />
      <circle cx="388" cy="168" r="8" fill="url(#goldHighlight)" stroke="none" />

      <!-- Left Scale Strings and Pan -->
      <g id="left-pan">
        <line x1="124" y1="172" x2="88" y2="258" stroke="url(#goldGrad)" stroke-width="2" opacity="0.85" />
        <line x1="124" y1="172" x2="124" y2="258" stroke="url(#goldGrad)" stroke-width="2" opacity="0.95" />
        <line x1="124" y1="172" x2="160" y2="258" stroke="url(#goldGrad)" stroke-width="2" opacity="0.85" />
        <!-- Pan Dish -->
        <path d="M 80, 258 C 80, 282 168, 282 168, 258 Z" fill="url(#goldGrad)" fill-opacity="0.25" stroke="url(#goldGrad)" stroke-width="4.5" />
        <line x1="76" y1="258" x2="172" y2="258" stroke="url(#goldGrad)" stroke-width="4" />
      </g>

      <!-- Right Scale Strings and Pan -->
      <g id="right-pan">
        <line x1="388" y1="172" x2="352" y2="258" stroke="url(#goldGrad)" stroke-width="2" opacity="0.85" />
        <line x1="388" y1="172" x2="388" y2="258" stroke="url(#goldGrad)" stroke-width="2" opacity="0.95" />
        <line x1="388" y1="172" x2="424" y2="258" stroke="url(#goldGrad)" stroke-width="2" opacity="0.85" />
        <!-- Pan Dish -->
        <path d="M 344, 258 C 344, 282 432, 282 432, 258 Z" fill="url(#goldGrad)" fill-opacity="0.25" stroke="url(#goldGrad)" stroke-width="4.5" />
        <line x1="340" y1="258" x2="436" y2="258" stroke="url(#goldGrad)" stroke-width="4" />
      </g>

      <!-- Central Classical Column Pillar -->
      <!-- Capital -->
      <path d="M 240, 160 L 272, 160 L 268, 174 L 244, 174 Z" fill="url(#goldGrad)" stroke="none" />
      <!-- Shaft -->
      <line x1="251" y1="174" x2="251" y2="340" stroke="url(#goldGrad)" stroke-width="3" />
      <line x1="256" y1="174" x2="256" y2="340" stroke="url(#goldHighlight)" stroke-width="4.5" />
      <line x1="261" y1="174" x2="261" y2="340" stroke="url(#goldGrad)" stroke-width="3" />
      <!-- Pillar Base Moulding -->
      <path d="M 236, 340 L 276, 340 L 282, 354 L 230, 354 Z" fill="url(#goldGrad)" stroke="none" />
      <rect x="220" y="354" width="72" height="12" rx="3" fill="url(#goldGrad)" stroke="none" />
    </g>

    <!-- Monogram 'V' & Pedestal Heraldry -->
    <g id="monogram" fill="url(#goldGrad)">
      <!-- Classical Serif 'V' for Valentina -->
      <path d="M 242, 380 L 256, 424 L 270, 380 L 282, 380 L 263, 436 L 249, 436 L 230, 380 Z" stroke="url(#goldGrad)" stroke-width="1.5" stroke-linejoin="bevel" />
      <!-- Serif brackets -->
      <rect x="226" y="378" width="10" height="3" />
      <rect x="276" y="378" width="10" height="3" />
    </g>

    <!-- Laurel Leaves Wreath framing bottom curve -->
    <g id="laurel" fill="url(#goldGrad)" opacity="0.9">
      <!-- Left side leaves -->
      <path d="M 188, 388 C 176, 384 168, 372 168, 372 C 168, 372 178, 375 186, 382 Z" />
      <path d="M 172, 410 C 160, 404 154, 390 154, 390 C 154, 390 164, 395 170, 404 Z" />
      <path d="M 160, 432 C 148, 424 144, 410 144, 410 C 144, 410 152, 417 156, 426 Z" />
      <path d="M 198, 432 C 190, 438 178, 442 178, 442 C 178, 442 186, 434 192, 426 Z" />
      <path d="M 216, 446 C 206, 452 194, 452 194, 452 C 194, 452 202, 446 210, 440 Z" />

      <!-- Right side leaves (mirrored) -->
      <path d="M 324, 388 C 336, 384 344, 372 344, 372 C 344, 372 334, 375 326, 382 Z" />
      <path d="M 340, 410 C 352, 404 358, 390 358, 390 C 358, 390 348, 395 342, 404 Z" />
      <path d="M 352, 432 C 364, 424 368, 410 368, 410 C 368, 410 360, 417 356, 426 Z" />
      <path d="M 314, 432 C 322, 438 334, 442 334, 442 C 334, 442 326, 434 320, 426 Z" />
      <path d="M 296, 446 C 306, 452 318, 452 318, 452 C 318, 452 310, 446 302, 440 Z" />

      <!-- Center tie knot / gem -->
      <circle cx="256" cy="454" r="5" fill="url(#goldHighlight)" />
    </g>

    <!-- Excellence 5-Point Stars -->
    <g fill="url(#goldHighlight)">
      <polygon points="256,58 259,66 268,66 261,71 263,79 256,74 249,79 251,71 244,66 253,66" />
      <polygon points="232,67 234,73 241,73 236,77 238,83 232,79 226,83 228,77 223,73 230,73" transform="scale(0.8) translate(50, 15)" />
      <polygon points="280,67 282,73 289,73 284,77 286,83 280,79 274,83 276,77 271,73 278,73" transform="scale(0.8) translate(65, 15)" />
    </g>
  </g>
</svg>